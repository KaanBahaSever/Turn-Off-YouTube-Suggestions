<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Turn Off YouTube Suggestions</title>
  <style>
    body {
      margin: 0;
      width: 240px;
      padding: 16px;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: #0f0f0f;
      color: #f1f1f1;
      text-align: center;
    }
    h1 {
      margin: 0 0 12px;
      font-size: 14px;
      font-weight: 600;
    }
    button {
      width: 100%;
      padding: 10px 12px;
      border: 0;
      border-radius: 8px;
      background: #ff0033;
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { background: #d9002b; }
    button:active { transform: scale(0.98); }
    #status {
      min-height: 16px;
      margin: 10px 0 0;
      font-size: 12px;
      color: #aaa;
    }
  </style>
</head>
<body>
  <h1>Turn Off YouTube Suggestions</h1>
  <button id="run">Remove suggestions</button>
  <p id="status"></p>
  <script src="popup.js"></script>
</body>
</html>
