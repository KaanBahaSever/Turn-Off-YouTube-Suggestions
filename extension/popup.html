<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Turn Off YouTube Suggestions</title>
  <style>
    body {
      margin: 0;
      width: 240px;
      padding: 16px;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: #0f0f0f;
      color: #f1f1f1;
      text-align: center;
    }
    h1 {
      margin: 0 0 12px;
      font-size: 14px;
      font-weight: 600;
    }
    button {
      width: 100%;
      padding: 10px 12px;
      border: 0;
      border-radius: 8px;
      background: #ff0033;
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { background: #d9002b; }
    button:active { transform: scale(0.98); }
    #status {
      min-height: 16px;
      margin: 10px 0 0;
      font-size: 12px;
      color: #aaa;
    }
    .toggle {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid #272727;
      text-align: left;
      cursor: pointer;
    }
    .toggle strong {
      display: block;
      font-size: 13px;
      font-weight: 600;
    }
    .toggle small {
      display: block;
      margin-top: 2px;
      font-size: 11px;
      color: #aaa;
    }
    .toggle input {
      appearance: none;
      position: relative;
      flex: none;
      width: 34px;
      height: 20px;
      margin: 0;
      border-radius: 10px;
      background: #3f3f3f;
      cursor: pointer;
      transition: background 0.15s;
    }
    .toggle input::after {
      content: "";
      position: absolute;
      top: 3px;
      left: 3px;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #fff;
      transition: transform 0.15s;
    }
    .toggle input:checked { background: #ff0033; }
    .toggle input:checked::after { transform: translateX(14px); }
    .toggle input:focus-visible { outline: 2px solid #3ea6ff; outline-offset: 2px; }
  </style>
</head>
<body>
  <h1>Turn Off YouTube Suggestions</h1>
  <button id="run">Remove suggestions</button>
  <p id="status"></p>
  <label class="toggle">
    <span>
      <strong>Remove automatically</strong>
      <small>Hide suggestions on every video</small>
    </span>
    <input type="checkbox" id="auto">
  </label>
  <script src="popup.js"></script>
</body>
</html>
